name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ISTDOCAI_ROOT: ${{ github.workspace }}/ISTDocAi
    defaults:
      run:
        working-directory: setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: setup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.ISTDOCAI_REPOSITORY }}
          token: ${{ secrets.ISTDOCAI_READ_TOKEN }}
          path: ISTDocAi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: setup/global.json
      - name: Locked restore
        run: dotnet restore ISTDocAi.Setup.sln --locked-mode
      - name: Release build with warnings as errors
        run: dotnet build ISTDocAi.Setup.sln -c Release --no-restore -warnaserror
      - name: Test without SQL or Machine prerequisites
        run: dotnet test tests/ISTDocAi.Setup.Tests/ISTDocAi.Setup.Tests.csproj -c Release --no-build --no-restore --filter 'TestCategory!=Sql&TestCategory!=Machine' --logger trx --results-directory TestResults/ci
      - name: Summarize tests and reject skips
        if: always()
        run: python .github/scripts/check-trx.py TestResults/ci
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify and run gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          result=0
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --exit-code 1 . || result=1
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir --redact --exit-code 1 . || result=1
          exit "$result"
